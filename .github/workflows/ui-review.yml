name: ModelStrike UI review

on:
  push:
    branches: [codex/modelstrike-impeccable-20261017]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Test native editor and geometry
        run: cargo test --locked --features native-ui
      - name: Build renderer capture target
        run: cargo build --locked --features native-ui --bin modelstrike-capture
      - name: Try current renderer capture
        id: capture
        continue-on-error: true
        timeout-minutes: 4
        shell: pwsh
        run: .\target\debug\modelstrike-capture.exe docs\screenshots\fixtures\synthetic-cuboid.mstrike review-modelstrike.png vertex:2
      - name: Upload current renderer evidence when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelstrike-renderer-review
          path: review-modelstrike.png
          if-no-files-found: ignore
