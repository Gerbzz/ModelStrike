name: ModelStrike UI review

on:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Test native editor and geometry
        run: cargo test --locked --features native-ui
      - name: Build renderer capture target
        run: cargo build --locked --features native-ui --bin modelstrike-capture

  approved-branding:
    name: Approved logo asset contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image inspection dependency
        run: python -m pip install Pillow==12.3.0
      - name: Verify approved source, derivatives and runtime bindings
        run: python scripts/check_approved_branding.py
